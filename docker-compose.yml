version: '3.8'

services:
  # Event Ledger Storage Engine
  ledger-db:
    image: postgres:16-alpine
    container_name: billing-ledger-db
    environment:
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: ledger_secret_pass
      POSTGRES_DB: event_ledger
    ports:
      - "5433:5432" # Shifted port to avoid conflicts with your main billing DB
    volumes:
      - ledger_data:/var/lib/postgresql/data

  # Distributed Message Broker
  message-broker:
    image: rabbitmq:3-management-alpine
    container_name: billing-message-broker
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # RabbitMQ Management Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: broker_user
      RABBITMQ_DEFAULT_PASS: broker_secret_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  ledger_data:
  rabbitmq_data:
